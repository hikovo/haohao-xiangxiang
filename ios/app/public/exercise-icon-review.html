<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动图标审查</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#76545e;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{width:min(100%,460px);padding:24px;margin:auto}h1{font-size:21px;margin:0 0 6px}p{margin:0 0 20px;color:#ac8b86;font-size:13px}.large{display:flex;justify-content:center;gap:56px;align-items:center;padding:26px 20px;background:#fffdf8;border:1px solid #efdfd0;border-radius:16px}.large img{width:96px;height:128px}.gray{filter:grayscale(1);opacity:.45}.label{display:flex;justify-content:space-around;font-size:12px;color:#b09289;margin:10px 0 26px}.week{border:1px solid #efdfd0;border-radius:16px;padding:16px;background:#fffdf8}.week h2{font-size:16px;margin:0 0 15px}.row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{display:grid;place-items:center;gap:8px;color:#ab8e88;font-size:11px}.day img{width:24px;height:32px}.caption{font-size:12px;margin-top:18px} </style></head><body><main><h1>运动小人图标稿</h1><p>沿用 1.7 线宽与圆头笔触，保留奔跑、笑脸和举手的姿态。</p><div class="large"><img class="gray" src="/exercise-runner.svg" alt="未打卡图标"><img src="/exercise-runner.svg" alt="已打卡图标"></div><div class="label"><span>未打卡</span><span>已打卡</span></div><div class="week"><h2>实际大小 · 每周一排</h2><div class="row"><div class="day">一<img src="/exercise-runner.svg" alt="运动"></div><div class="day">二<img src="/exercise-runner.svg" alt="运动"></div><div class="day">三<img src="/exercise-runner.svg" alt="运动"></div><div class="day">四<img class="gray" src="/exercise-runner.svg" alt="运动"></div><div class="day">五<img class="gray" src="/exercise-runner.svg" alt="运动"></div><div class="day">六<img class="gray" src="/exercise-runner.svg" alt="运动"></div><div class="day">日<img class="gray" src="/exercise-runner.svg" alt="运动"></div></div></div><p class="caption">上方放大方便看细节；下方为打卡行里的 24 × 32 像素大小。</p></main></body></html>
